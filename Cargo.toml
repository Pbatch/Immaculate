[package]
name = "immaculate"
version = "0.2.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[lib]
name = "_core"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
# ONNX Runtime is loaded at runtime from the onnxruntime Python package, which the sscd extra
# installs, so it isn't built into the wheel. Without the api-* features ort needs only ONNX Runtime 1.17 or later.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["load-dynamic", "std"] }
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
rayon = "1.12.0"
walkdir = "2.5.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Stops `unwrap_or_else(|| unreachable!())` standing in for `expect`
unreachable = "warn"
allow_attributes = "warn"
