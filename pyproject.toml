[project]
name = "Immaculate"
version = "0.4.0"
description = "Find problematic images fast."
readme = "README.md"
authors = [{ name = "Peter Batchelor" }]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sscd = [
    # The "sscd" and "sscd_distilled" methods' models, in their own package because they would
    # be nearly all of the size of Immaculate's wheels
    "immaculate-onnx==0.1.0",
    # Runs the models; the Rust bindings need 1.17 or later
    "onnxruntime>=1.17",
]

[project.scripts]
immaculate = "immaculate.__main__:cli"

[project.urls]
Documentation = "https://pbatch.github.io/Immaculate/"
Repository = "https://github.com/Pbatch/Immaculate"
Issues = "https://github.com/Pbatch/Immaculate/issues"

[dependency-groups]
benchmark = [
    # Only what benchmark_duplicates.py needs; each library has its own environment in
    # benchmark/envs
    "loguru==0.8.0",
    "pillow==13.0.0",
    "pyarrow==26.0.1",
]
dev = [
    # The tests run the SSCD methods, and the release workflow syncs this group without the
    # project, so its sscd extra isn't installed
    "immaculate-onnx",
    # ONNX Runtime's last Intel Mac wheels are 1.23.2
    "onnxruntime==1.32.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pillow==13.0.0",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "ty==0.0.107",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.2",
    "mkdocstrings==1.0.8",
    "mkdocstrings-python==2.0.11",
    "ruff==0.17.6",
]

[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "immaculate._core"
features = ["pyo3/extension-module"]
# The benchmark suite and its multi-GB image data aren't part of the package
exclude = [
    { path = "benchmark/**/*", format = "sdist" },
    { path = "DEPLOYMENT.md", format = "sdist" },
    # The README's example photos
    { path = "examples/**/*", format = "sdist" },
    # Published as its own package, immaculate-onnx
    { path = "immaculate-onnx/**/*", format = "sdist" },
]

[tool.uv]
# Rebuild the Rust extension when its sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "rust/**/*.rs" }]
default-groups = ["dev", "benchmark"]

[tool.uv.workspace]
members = ["immaculate-onnx"]

[tool.uv.sources]
immaculate-onnx = { workspace = true }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with the formatter
    "CPY001",  # Copyright headers are not required
    "D",       # Public API docstrings are not mandatory
    "INP001",  # scripts and tests are intentionally not packages
    "ISC001",  # Conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Launching the libraries in subprocesses is its job; commands are built from fixed paths
"benchmark/launcher.py" = ["S603", "S607"]
# Prints its results as Markdown tables
"benchmark/report.py" = ["T201"]
# Prints the checks a library implements, as JSON, for launcher.py to read
"benchmark/runner.py" = ["T201"]

[tool.ty.src]
# The libraries the deduplicators wrap are only installed in their own environments
exclude = ["benchmark/checkers/*_checker.py", "benchmark/envs"]
