name: Release

# Builds the sdist and a wheel for each platform ONNX Runtime has wheels for, so the sscd extra
# installs wherever Immaculate does, tests each wheel on its own platform, and on a version tag
# publishes them, with the immaculate-onnx package, to PyPI; see DEPLOYMENT.md
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          # ONNX Runtime's last Intel Mac wheels are 1.23.2, which pip picks there
          - os: macos-15-intel
          - os: windows-latest
          - os: windows-11-arm
            python-arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          args: --release --out dist
          # ONNX Runtime's own Linux wheels need glibc 2.28
          manylinux: "2_28"
      - uses: astral-sh/setup-uv@v6
      # Tests the built wheel, not the source tree: the dev group doesn't include Immaculate,
      # so syncing it doesn't build it. It does install immaculate-onnx from the source tree,
      # for the tests of the SSCD methods
      - name: Test the wheel
        shell: bash
        # Only uv sync is given the Python: with UV_PYTHON set, uv pip would install into that
        # interpreter instead of .venv
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          uv sync --locked --only-group dev --python "$PYTHON"
          uv pip install dist/*.whl
          uv run --no-sync pytest
      - uses: actions/upload-artifact@v4
        with:
          name: immaculate-wheel-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: immaculate-sdist
          path: dist/*.tar.gz

  # Pure Python, so one wheel serves every platform
  onnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build --package immaculate-onnx --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: onnx
          path: dist/*

  # Uploads use trusted publishing, so no tokens are stored; PyPI trusts this workflow in the
  # pypi environment, which needs approval
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, onnx]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/immaculate/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: immaculate-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: onnx
          path: onnx-dist
      # PyPI never accepts a version twice, so a tag like v0.1.0-test mustn't upload 0.1.0
      - name: Check the tag matches the version
        run: test -f "dist/immaculate-${GITHUB_REF_NAME#v}.tar.gz"
      # Before Immaculate, whose sscd extra pins it. Its version only changes with the models,
      # so most releases have already uploaded it
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: onnx-dist/
          skip-existing: true
      - uses: pypa/gh-action-pypi-publish@release/v1
